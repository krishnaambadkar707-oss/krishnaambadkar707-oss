<svg width="320" height="460" viewBox="0 0 320 460" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>

    <!-- Card Glow Filter -->
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="avatarBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#7b2ff7"/>
      <stop offset="100%" stop-color="#ff7eb6"/>
    </linearGradient>

    <!-- Clip Path for User Photo Avatar -->
    <clipPath id="avatarClip">
      <circle cx="160" cy="225" r="52" />
    </clipPath>
  </defs>

  <!-- Lanyard Strap -->
  <rect x="150" y="0" width="20" height="55" fill="#374151" rx="4"/>
  <circle cx="160" cy="65" r="15" fill="#9ca3af" stroke="#4b5563" stroke-width="3"/>
  <circle cx="160" cy="65" r="5" fill="#0d1117"/>

  <!-- Main Card Body -->
  <rect x="20" y="80" width="280" height="360" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Header Banner -->
  <path d="M 20 100 Q 20 80 40 80 L 280 80 Q 300 80 300 100 L 300 160 L 20 160 Z" fill="url(#headerGrad)"/>

  <!-- Card Title -->
  <text x="160" y="112" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#0f172a" letter-spacing="1.5">
    AI / ML ENGINEER ID
  </text>
  
  <!-- Location Details (Badnera | Amravati | Maharashtra | India) -->
  <text x="160" y="134" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#1e1b4b" letter-spacing="0.3">
    Badnera | Amravati | Maharashtra | India
  </text>

  <!-- Avatar Outer Ring -->
  <circle cx="160" cy="225" r="57" fill="url(#avatarBorder)"/>
  <circle cx="160" cy="225" r="53" fill="#0f172a"/>
  
  <!-- Embedded Photo Avatar -->
  <image href="My%20photo.jpeg" xlink:href="My%20photo.jpeg" x="108" y="173" width="104" height="104" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)"/>

  <!-- Verified Checkmark Badge -->
  <circle cx="198" cy="260" r="12" fill="#10b981" stroke="#0f172a" stroke-width="2.5"/>
  <path d="M 193 260 L 196.5 263.5 L 203 257" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Name & Title -->
  <text x="160" y="315" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">
    Krishna S. Ambadkar
  </text>
  <text x="160" y="336" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">
    AI &amp; Data Science | AI/ML Engineer
  </text>
  <text x="160" y="356" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">
    @krishnaambadkar707-oss
  </text>

  <!-- Divider Line -->
  <line x1="45" y1="375" x2="275" y2="375" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Tech Tags -->
  <text x="160" y="395" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#a78bfa" letter-spacing="0.5">
    GenAI • RAG • ML • FastAPI • React
  </text>

  <!-- Barcode Strip -->
  <g fill="#475569">
    <rect x="60" y="412" width="3" height="18"/>
    <rect x="66" y="412" width="2" height="18"/>
    <rect x="72" y="412" width="4" height="18"/>
    <rect x="80" y="412" width="2" height="18"/>
    <rect x="86" y="412" width="3" height="18"/>
    <rect x="93" y="412" width="2" height="18"/>
    <rect x="99" y="412" width="4" height="18"/>
    <rect x="107" y="412" width="3" height="18"/>
    <rect x="113" y="412" width="2" height="18"/>
    <rect x="119" y="412" width="3" height="18"/>
    <rect x="125" y="412" width="4" height="18"/>
    <rect x="133" y="412" width="2" height="18"/>
    <rect x="139" y="412" width="3" height="18"/>
    <rect x="145" y="412" width="4" height="18"/>
    <rect x="153" y="412" width="2" height="18"/>
    <rect x="159" y="412" width="3" height="18"/>
    <rect x="165" y="412" width="2" height="18"/>
    <rect x="171" y="412" width="4" height="18"/>
    <rect x="179" y="412" width="3" height="18"/>
    <rect x="185" y="412" width="2" height="18"/>
    <rect x="191" y="412" width="4" height="18"/>
    <rect x="199" y="412" width="2" height="18"/>
    <rect x="205" y="412" width="3" height="18"/>
    <rect x="211" y="412" width="4" height="18"/>
    <rect x="219" y="412" width="2" height="18"/>
    <rect x="225" y="412" width="3" height="18"/>
    <rect x="231" y="412" width="2" height="18"/>
    <rect x="237" y="412" width="4" height="18"/>
    <rect x="245" y="412" width="3" height="18"/>
    <rect x="251" y="412" width="2" height="18"/>
  </g>
</svg>
