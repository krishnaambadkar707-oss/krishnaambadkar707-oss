<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#1b1035"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bgGrad)"/>

  <!-- decorative "neural network" nodes -->
  <g stroke="#3d3a63" stroke-width="1.5" opacity="0.6">
    <line x1="880" y1="40" x2="960" y2="90"/>
    <line x1="960" y1="90" x2="920" y2="160"/>
    <line x1="960" y1="90" x2="1040" y2="120"/>
    <line x1="920" y1="160" x2="1000" y2="210"/>
    <line x1="1040" y1="120" x2="1000" y2="210"/>
    <line x1="1040" y1="120" x2="1110" y2="90"/>
    <line x1="1000" y1="210" x2="1080" y2="250"/>
    <line x1="1110" y1="90" x2="1150" y2="160"/>
    <line x1="1080" y1="250" x2="1150" y2="160"/>
  </g>
  <g fill="#00d4ff">
    <circle cx="880" cy="40" r="4"/>
    <circle cx="960" cy="90" r="5"/>
    <circle cx="1040" cy="120" r="4"/>
    <circle cx="1110" cy="90" r="4"/>
    <circle cx="1150" cy="160" r="4"/>
  </g>
  <g fill="#7b2ff7">
    <circle cx="920" cy="160" r="5"/>
    <circle cx="1000" cy="210" r="5"/>
    <circle cx="1080" cy="250" r="4"/>
  </g>

  <text x="60" y="115" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f0f6fc">
    Krishna Sunil Ambadkar
  </text>
  <text x="62" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="url(#textGrad)">
    AI &amp; Data Science Engineer
  </text>
  <text x="62" y="195" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">
    GenAI · RAG · Machine Learning · Full-Stack AI Apps
  </text>
  <text x="62" y="225" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#58a6ff">
    "I don't just train models, I ship them."
  </text>
