<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f1435"/>
    </linearGradient>

    <!-- Text Glow Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- Avatar Border Gradient -->
    <linearGradient id="avatarBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#7b2ff7"/>
      <stop offset="100%" stop-color="#ff7eb6"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7eb6"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="0.7" opacity="0.4"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Clip Path for Avatar Photo -->
    <clipPath id="bannerAvatarClip">
      <circle cx="130" cy="160" r="75" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Decorative Glowing Orbs -->
  <circle cx="1020" cy="160" r="140" fill="#7b2ff7" opacity="0.12" filter="url(#glow)"/>
  <circle cx="130" cy="160" r="110" fill="#00f2fe" opacity="0.1" filter="url(#glow)"/>

  <!-- Neural Network Tech Constellation -->
  <g stroke="#3b4261" stroke-width="1.5" opacity="0.7">
    <line x1="880" y1="60" x2="960" y2="110"/>
    <line x1="960" y1="110" x2="920" y2="190"/>
    <line x1="960" y1="110" x2="1050" y2="130"/>
    <line x1="920" y1="190" x2="1010" y2="230"/>
    <line x1="1050" y1="130" x2="1010" y2="230"/>
    <line x1="1050" y1="130" x2="1120" y2="90"/>
    <line x1="1010" y1="230" x2="1100" y2="270"/>
    <line x1="1120" y1="90" x2="1160" y2="170"/>
    <line x1="1100" y1="270" x2="1160" y2="170"/>
  </g>
  <g fill="#00f2fe">
    <circle cx="880" cy="60" r="5" filter="url(#glow)"/>
    <circle cx="960" cy="110" r="6"/>
    <circle cx="1050" cy="130" r="5"/>
    <circle cx="1120" cy="90" r="4"/>
    <circle cx="1160" cy="170" r="5" filter="url(#glow)"/>
  </g>
  <g fill="#ff7eb6">
    <circle cx="920" cy="190" r="5"/>
    <circle cx="1010" cy="230" r="6" filter="url(#glow)"/>
    <circle cx="1100" cy="270" r="4"/>
  </g>

  <!-- Photo Avatar Section -->
  <g>
    <!-- Outer Glowing Ring -->
    <circle cx="130" cy="160" r="81" fill="url(#avatarBorderGrad)"/>
    <circle cx="130" cy="160" r="76" fill="#0b0f19"/>
    
    <!-- User Photo -->
    <image href="My%20photo.jpeg" xlink:href="My%20photo.jpeg" x="55" y="85" width="150" height="150" preserveAspectRatio="xMidYMid slice" clip-path="url(#bannerAvatarClip)"/>

    <!-- Small Online Status Badge -->
    <circle cx="188" cy="218" r="14" fill="#0b0f19" />
    <circle cx="188" cy="218" r="10" fill="#10b981" />
  </g>

  <!-- Text Content Section (Positioned alongside photo) -->
  <g transform="translate(250, 0)">
    <!-- Status Pill -->
    <rect x="0" y="58" width="240" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
    <circle cx="15" cy="72" r="4" fill="#10b981"/>
    <text x="28" y="77" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc" letter-spacing="0.5">
      BUILDING NEXT-GEN AI &amp; ML
    </text>

    <!-- Name -->
    <text x="0" y="132" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Krishna Sunil Ambadkar
    </text>

    <!-- Subtitle / Role -->
    <text x="0" y="172" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="21" font-weight="700" fill="url(#textGrad)">
      AI &amp; Data Science | AI/ML Engineer
    </text>

    <!-- Core Tags -->
    <text x="0" y="208" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">
      Generative AI  •  RAG Architectures  •  Computer Vision  •  Full-Stack AI Apps
    </text>

    <!-- Quote -->
    <text x="0" y="242" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="14" font-style="italic" fill="#ff7eb6">
      "I don't just train models, I model data and ship intelligent systems."
    </text>
  </g>
</svg>
