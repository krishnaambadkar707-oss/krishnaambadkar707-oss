<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Krishna Sunil Ambadkar - AI and Data Science, GenAI and ML engineering">
  <defs>
    <radialGradient id="roomGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#241b35"/>
      <stop offset="60%" stop-color="#140f21"/>
      <stop offset="100%" stop-color="#0a0712"/>
    </radialGradient>
    <radialGradient id="cardBg" cx="30%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#1e1438"/>
      <stop offset="50%" stop-color="#140d27"/>
      <stop offset="100%" stop-color="#0e081c"/>
    </radialGradient>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nameGlow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="avatarClip">
      <rect x="80" y="0" width="450" height="430" rx="15"/>
    </clipPath>
  </defs>

  <style>
    /* No web fonts: GitHub blocks external requests inside SVG images, so these use system fallbacks. */
    .mono  { font-family: 'Fira Code', Consolas, 'Courier New', monospace; }
    .sans  { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .term-text { font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 11px; fill: #a78bfa; }
    .title-hi { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; }
    .name-title { font-family: Pacifico, 'Segoe Script', 'Brush Script MT', cursive; font-size: 38px; fill: #f472b6; }
    .sub-title { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 600; fill: #cbd5e1; letter-spacing: 0.5px; }
    .quote-text { font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 12px; fill: #f1f5f9; }
    .section-head { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #e2e8f0; }
    .pill-text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 500; }
    .stat-label { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 9.5px; fill: #94a3b8; }
    .stat-val { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; }
    .footer-text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #94a3b8; }
    .code-editor { font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 10px; fill: #93c5fd; }
    .blink { animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
  </style>

  <!-- Ambient room background -->
  <rect width="1200" height="675" fill="url(#roomGlow)"/>

